<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>{% block title %}Uwezo Fund Diagnosis{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f9f9f9;
    }
    .header {
      background-color: #6f42c1; /* Purple */
      color: #fff;
      padding: 1rem;
      text-align: center;
    }
    footer {
      background: #6f42c1;
      color: #fff;
      padding: 1rem;
      text-align: center;
      margin-top: 50px;
    }
    .btn-primary, .btn-success {
      background-color: #6f42c1;
      border-color: #6f42c1;
    }
    .btn-primary:hover, .btn-success:hover {
      background-color: #59359c;
      border-color: #59359c;
    }
    .alert-info {
      border-left: 5px solid #6f42c1;
    }
    .alert-danger {
      border-left: 5px solid #dc3545;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Uwezo Fund Oversight Board</h1>
    <h4>Loan Repayment Account Quarterly Diagnosis Tool</h4>
  </div>

  <div class="container mt-4">
    {% block content %}{% endblock %}
  </div>

  <footer>
    &copy; 2025 Uwezo Fund Oversight Board
  </footer>

</body>
</html>
